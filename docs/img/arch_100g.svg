<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="980" height="360" fill="#ffffff"/>
  <rect x="10" y="30" width="960" height="235" rx="8" fill="none" stroke="#999" stroke-dasharray="6 4"/>
  <text x="18" y="22" font-weight="bold" fill="#333">RFSoC 4x2 PL (XCZU48DR)</text>

  <g text-anchor="middle">
    <!-- Xilinx IP: gray -->
    <rect x="20" y="50" width="120" height="64" rx="6" fill="#f2f2f2" stroke="#777"/>
    <text x="80" y="73" font-weight="bold">DDS / ramp</text><text x="80" y="91">125 MHz</text><text x="80" y="107" fill="#555">4 Gbps write</text>

    <rect x="170" y="50" width="160" height="64" rx="6" fill="#f2f2f2" stroke="#777"/>
    <text x="250" y="73" font-weight="bold">PL DDR4-2400</text><text x="250" y="91">MIG + AXI DataMover</text><text x="250" y="107" fill="#555">512b @ 300 MHz</text>

    <!-- verilog-ethernet: blue -->
    <rect x="360" y="50" width="110" height="64" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="415" y="78" font-weight="bold">async FIFO</text><text x="415" y="96">MIG → core clock</text>

    <!-- this project: green -->
    <rect x="500" y="50" width="180" height="64" rx="6" fill="#d5e8d4" stroke="#82b366"/>
    <text x="590" y="73" font-weight="bold">record_eth_tx</text><text x="590" y="91">complete Eth/IP/UDP frames</text><text x="590" y="107" fill="#555">129 beats per 8 KB packet</text>

    <rect x="500" y="180" width="180" height="64" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="590" y="203" font-weight="bold">udp_stack</text><text x="590" y="221">ARP · ICMP echo · UDP echo</text><text x="590" y="237" fill="#555">512b @ 250 MHz</text>

    <rect x="710" y="115" width="100" height="64" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="760" y="143" font-weight="bold">arb mux</text><text x="760" y="161">MAC level</text>

    <rect x="840" y="50" width="120" height="64" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="900" y="73" font-weight="bold">async FIFO</text><text x="900" y="91">250 → 322 MHz</text><text x="900" y="107" fill="#555">+ min-frame pad</text>

    <rect x="840" y="180" width="120" height="64" rx="6" fill="#f2f2f2" stroke="#777"/>
    <text x="900" y="203" font-weight="bold">CMAC 100GbE</text><text x="900" y="221">CAUI-4 · RS-FEC</text><text x="900" y="237" fill="#555">512b @ 322 MHz</text>

    <!-- off-chip -->
    <rect x="840" y="295" width="120" height="50" rx="6" fill="#ffffff" stroke="#777"/>
    <text x="900" y="325" font-weight="bold">QSFP28</text>

    <rect x="560" y="295" width="230" height="50" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="675" y="315" font-weight="bold">PC: ConnectX-4 MCX455A</text><text x="675" y="333">Windows · RIO receiver · viewer</text>
  </g>

  <g stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="140" y1="82" x2="168" y2="82"/>
    <line x1="330" y1="82" x2="358" y2="82"/>
    <line x1="470" y1="82" x2="498" y2="82"/>
    <polyline points="680,82 695,82 695,135 708,135"/>
    <polyline points="680,200 695,200 695,160 708,160"/>
    <polyline points="810,147 825,147 825,82 838,82"/>
    <line x1="900" y1="114" x2="900" y2="178"/>
    <line x1="900" y1="244" x2="900" y2="293" marker-start="url(#a)"/>
    <line x1="840" y1="320" x2="792" y2="320" marker-start="url(#a)"/>
    <line x1="840" y1="228" x2="682" y2="228"/>
  </g>
  <text x="761" y="222" font-size="11" fill="#555" text-anchor="middle">RX (async FIFO)</text>
  <text x="155" y="72" font-size="11" fill="#555" text-anchor="middle">write</text>
  <text x="484" y="72" font-size="11" fill="#555" text-anchor="middle">98.9G</text>
  <text x="908" y="283" font-size="11" fill="#555">99.71 Gbps</text>

  <g font-size="12">
    <rect x="470" y="10" width="14" height="14" fill="#d5e8d4" stroke="#82b366"/><text x="490" y="22">this project</text>
    <rect x="570" y="10" width="14" height="14" fill="#dae8fc" stroke="#6c8ebf"/><text x="590" y="22">verilog-ethernet based</text>
    <rect x="730" y="10" width="14" height="14" fill="#f2f2f2" stroke="#777"/><text x="750" y="22">Xilinx IP</text>
    <rect x="830" y="10" width="14" height="14" fill="#ffe6cc" stroke="#d79b00"/><text x="850" y="22">host PC</text>
  </g>
</svg>
